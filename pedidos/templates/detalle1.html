<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de los Pedidos</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f0fa;
        color: #302641;
        margin: 0;
        padding: 45px 16px;
        min-height: 100vh;
    }

    .card {
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff;
        padding: 32px;
        border-radius: 14px;
        border: 1px solid #e5dcf2;
        box-shadow: 0 6px 22px rgba(75, 45, 120, 0.09);
    }

    h1 {
        text-align: center;
        font-size: 1.7rem;
        margin: 0 0 28px;
        color: #56358c;
        padding-bottom: 18px;
        border-bottom: 2px solid #eee7f7;
    }

    .detail-item {
        margin-bottom: 18px;
        padding: 13px 15px;
        background: #faf8fd;
        border-radius: 8px;
        border-left: 4px solid #8959c7;
    }

    .detail-item span {
        display: block;
        margin-bottom: 6px;
        font-size: 0.78rem;
        font-weight: bold;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #79658f;
    }

    .detail-item p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.6;
        color: #302641;
        word-break: break-word;
    }

    .footer-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 26px;
    }

    .link-back {
        font-size: 0.9rem;
        color: #79658f;
        text-decoration: none;
        transition: color 0.2s;
    }

    .link-back:hover {
        color: #56358c;
        text-decoration: underline;
    }

    .btn-edit {
        padding: 11px 25px;
        font-size: 0.95rem;
        font-weight: bold;
        color: #ffffff;
        background: #7546ad;
        border-radius: 8px;
        text-decoration: none;
        transition: background 0.2s, transform 0.1s;
    }

    .btn-edit:hover {
        background: #5d328f;
    }

    .btn-edit:active {
        transform: scale(0.98);
    }

    @media (max-width: 520px) {
        body {
            padding: 25px 12px;
        }

        .card {
            padding: 24px 18px;
        }

        h1 {
            font-size: 1.45rem;
        }

        .footer-actions {
            flex-direction: column-reverse;
            align-items: stretch;
        }

        .link-back {
            text-align: center;
            padding: 8px;
        }

        .btn-edit {
            width: 100%;
            text-align: center;
        }
    }
</style>
</head>
<body>

    <div class="card">
        <h1>Detalle de los Pedidos</h1>

        <div class="detail-item">
            <span>Número de Pedido</span>
            <p>{{ Pedido.numero_pedido }}</p>
        </div>

        <div class="detail-item">
            <span>Nombre del Cliente</span>
            <p>{{ Pedido.nombre_cliente }}</p>
        </div>

        <div class="detail-item">
            <span>Fecha</span>
            <p>{{ Pedido.fecha }}</p>
        </div>

        <div class="detail-item">
            <span>Descripción</span>
            <p>{{ Pedido.descripcion }}</p>
        </div>

        <div class="detail-item">
            <span>Total</span>
            <p>{{ Pedido.total }}</p>
        </div>

        <div class="detail-item">
            <span>Estado</span>
            <p>{{ Pedido.estado }}</p>
        </div>

        <div class="detail-item">
            <span>Usuario</span>
            <p>{{ Pedido.usuario }}</p>
        </div>

        <div class="footer-actions">
            <a href="/pedidos/lista/" class="link-back">← Volver al listado</a>
            <a href="/pedidos/editar/{{ Pedido.id }}/" class="btn-edit">Editar</a>
        </div>
    </div>

</body>
</html>
