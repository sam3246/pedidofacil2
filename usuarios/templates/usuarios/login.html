<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario login</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f0fa;
        color: #302641;
        margin: 0;
        padding: 45px 16px;
        min-height: 100vh;
    }

    h1 {
        text-align: center;
        font-size: 1.8rem;
        margin: 0 0 28px;
        color: #56358c;
    }

    form {
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        padding: 32px;
        border: 1px solid #e5dcf2;
        border-radius: 14px;
        box-shadow: 0 6px 22px rgba(75, 45, 120, 0.09);
    }

    .form-group {
        margin-bottom: 20px;
    }

    .fecha {
        display: block;
        width: 100%;
        min-height: 44px;
        border-radius: 8px;
        border: 1px solid #d6c9e8;
        color: #302641;
        background: #faf8fd;
        padding: 10px 12px;
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.92rem;
        font-weight: bold;
        color: #624b80;
    }

    input[type="text"] {
        display: block;
        width: 100%;
        padding: 12px 14px;
        font-size: 1rem;
        font-family: inherit;
        color: #302641;
        background: #faf8fd;
        border: 1px solid #d6c9e8;
        border-radius: 8px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    .fecha:focus {
        outline: none;
        background: #ffffff;
        border-color: #8959c7;
        box-shadow: 0 0 0 3px rgba(137, 89, 199, 0.15);
    }

    .btn-submit {
        width: 100%;
        padding: 13px;
        margin-top: 8px;
        font-size: 1rem;
        font-weight: bold;
        font-family: inherit;
        color: #ffffff;
        background: #7546ad;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
        background: #5d328f;
    }

    .btn-submit:active {
        transform: scale(0.98);
    }

    .back-link {
        display: block;
        margin-top: 16px;
        text-align: center;
        font-size: 0.9rem;
        color: #79658f;
        text-decoration: none;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: #56358c;
        text-decoration: underline;
    }

    @media (max-width: 520px) {
        body {
            padding: 25px 12px;
        }

        form {
            padding: 24px 18px;
        }

        h1 {
            font-size: 1.55rem;
        }
    }
</style>
</head>
<body>
    <h1>Iniciar Sesión</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <input type="text" id="username" name="username" value="{{ form.username.value|default:'' }}" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" class="fecha" id="password" name="password" required autocomplete="off">
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>

</body>
</html>
